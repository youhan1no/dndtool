<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dnd工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .container {
            display: flex;
            justify-content: center; /* 修改为居中对齐 */
            width: 90%;
            max-width: 1200px;
            min-width: 800px;
        }

        .section {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 30%;
            min-width: 250px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 10px; /* 增加左右外边距，避免元素过于拥挤 */
        }

        input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
            width: 80%;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result,
        #random-results,
        #table-results {
            margin-top: 20px;
            font-size: 18px;
            width: 80%;
            word-wrap: break-word;
            min-height: 150px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 生成随机结果部分 -->
        <div class="section">
            <h2>dnd10</h2>
            <button id="generateRandomButton">dnd10</button>
            <input type="text" id="key-input">
            <div id="random-results"></div>
        </div>
        <!-- 骰子投掷部分 -->
        <div class="section">
            <h2>掷骰</h2>
            <input type="text" id="input" placeholder="输入 xdn 或 x#dn">
            <button id="rollButton">投掷骰子</button>
            <div id="result"></div>
        </div>
        <!-- 生成表格部分 -->
        <div class="section">
            <h2>先攻表</h2>
            <p>请输入以逗号分隔的数字，例如 5,3,4,7</p>
            <input type="text" id="bonus-input" placeholder="输入数字，用逗号分隔">
            <button id="generateTableButton">生成表格</button>
            <div id="table-results"></div>
        </div>
    </div>

    <script>
        const input = document.getElementById('input');
        const rollButton = document.getElementById('rollButton');
        const generateRandomButton = document.getElementById('generateRandomButton');
        const bonusInput = document.getElementById('bonus-input');
        const generateTableButton = document.getElementById('generateTableButton');
        const resultDiv = document.getElementById('result');
        const randomResultsDiv = document.getElementById('random-results');
        const tableResultsDiv = document.getElementById('table-results');
        const keyInput = document.getElementById('key-input');

        let isButtonClicked = false;
        const correctKey = 'dnd';

        // 模拟投掷指定数量和面数的骰子
        const rollDice = function (numDice, numSides) {
            const rolls = [];
            for (let i = 0; i < numDice; i++) {
                const roll = Math.floor(Math.random() * numSides) + 1;
                rolls.push(roll);
            }
            return rolls;
        };

        // 处理用户输入的 xdn 或 x#dn 格式进行骰子投掷
        const handleRoll = function () {
            const inputValue = input.value;
            const regexNormal = /^(\d+)d(\d+)$/;
            const regexRepeat = /^(\d+)#d(\d+)$/;
            let match;

            if ((match = inputValue.match(regexNormal))) {
                const numDice = parseInt(match[1]);
                const numSides = parseInt(match[2]);
                const rolls = rollDice(numDice, numSides);
                const total = rolls.reduce((sum, num) => sum + num, 0);
                const resultText = `每次投掷结果: ${rolls.join(', ')}，总和: ${total}`;
                resultDiv.textContent = resultText;
            } else if ((match = inputValue.match(regexRepeat))) {
                const numDice = parseInt(match[1]);
                const numSides = parseInt(match[2]);
                const firstRoll = rollDice(numDice, numSides);
                const firstTotal = firstRoll.reduce((sum, num) => sum + num, 0);
                const secondRoll = rollDice(numDice, numSides);
                const secondTotal = secondRoll.reduce((sum, num) => sum + num, 0);

                const resultText = `第一次投掷结果: ${firstRoll.join(', ')}，总和: ${firstTotal}；第二次投掷结果: ${secondRoll.join(', ')}，总和: ${secondTotal}`;
                resultDiv.textContent = resultText;
            } else {
                resultDiv.textContent = '输入格式不正确，请使用 xdn 或 x#dn 格式。';
            }
        };

        // 按照 4d6 取 3 重复 6 次生成一个结果，共生成 10 个结果
        const generateRandomResults = function () {
            if (isButtonClicked) {
                const enteredKey = keyInput.value;
                if (enteredKey === correctKey) {
                    isButtonClicked = false;
                    keyInput.value = '';
                } else {
                    alert('密钥不正确，请输入正确的密钥。');
                    return;
                }
            }

            const allResults = [];
            for (let outer = 0; outer < 10; outer++) {
                const singleResult = [];
                for (let inner = 0; inner < 6; inner++) {
                    const rolls = rollDice(4, 6);
                    rolls.sort((a, b) => a - b);
                    const topThree = rolls.slice(1);
                    const total = topThree.reduce((sum, num) => sum + num, 0);
                    singleResult.push(total);
                }
                // 对单次结果数组进行从大到小排序
                singleResult.sort((a, b) => b - a);
                const totalForThisSet = singleResult.reduce((sum, num) => sum + num, 0);
                allResults.push({ numbers: singleResult, total: totalForThisSet });
            }

            allResults.sort((a, b) => b.total - a.total);

            let output = '';
            allResults.forEach(result => {
                output += `[${result.numbers.join(', ')}] = ${result.total}<br>`;
            });
            randomResultsDiv.innerHTML = output;

            isButtonClicked = true;
        };

        // 生成表格
        const generateTable = function () {
            const inputValue = bonusInput.value;
            const bonuses = inputValue.split(',').map(Number);
            if (bonuses.some(isNaN)) {
                tableResultsDiv.textContent = '输入格式不正确，请输入以逗号分隔的数字。';
                return;
            }

            const results = [];
            for (let i = 0; i < bonuses.length; i++) {
                const roll = rollDice(1, 20)[0];
                const total = roll + bonuses[i];
                results.push({ index: i, roll, bonus: bonuses[i], total });
            }

            results.sort((a, b) => b.total - a.total);

            let tableText = `输入了${bonuses.join(', ')}<br>`;
            const order = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
            results.forEach(result => {
                tableText += `${order[result.index]}、${result.roll}+${result.bonus}=${result.total}<br>`;
            });
            tableResultsDiv.innerHTML = tableText;
        };

        // 处理回车键事件
        const handleKeydown = function (event) {
            if (event.key === 'Enter') {
                if (event.target === input) {
                    handleRoll();
                } else if (event.target === bonusInput) {
                    generateTable();
                }
            }
        };

        // 为按钮和输入框添加事件监听器
        rollButton.addEventListener('click', handleRoll);
        generateRandomButton.addEventListener('click', generateRandomResults);
        generateTableButton.addEventListener('click', generateTable);
        input.addEventListener('keydown', handleKeydown);
        bonusInput.addEventListener('keydown', handleKeydown);
    </script>
</body>

</html>
